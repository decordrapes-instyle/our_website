  <style>
    :root {
      --bg:       #FBFAF7;
      --ink:      #14110E;
      --ink-soft: #6E6862;
      --faint:    #A79F94;
      --line:     #ECE6DC;
      --accent:   #A8834F;
      --android:  #3DDC84;
      --shadow:   0 26px 60px -22px rgba(35,25,12,.30);
      --ease:     cubic-bezier(.22,.9,.3,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #121110;
        --ink:      #F3EFE8;
        --ink-soft: #A8A199;
        --faint:    #6E6862;
        --line:     #2A2724;
        --accent:   #C9A46B;
        --android:  #3DDC84;
        --shadow:   0 26px 60px -22px rgba(0,0,0,.6);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; background: var(--bg); }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 64px 24px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle warm halo behind everything */
    body::before {
      content: "";
      position: fixed;
      top: -280px;
      left: 50%;
      width: 760px;
      height: 760px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(168,131,79,.16) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
      filter: blur(8px);
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ============ LOGO ============ */
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      padding: 3px;
      box-shadow:
        0 18px 44px -18px rgba(35,25,12,.35),
        0 0 0 1px var(--line);
      display: block;
      margin-bottom: 34px;
      animation: rise .9s var(--ease) both;
    }

    /* ============ BRAND ============ */
    h1.brand {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.35rem, 9vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: -.035em;
      animation: rise .9s .08s var(--ease) both;
    }

    h1.brand em {
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
    }

    .tagline {
      margin-top: 18px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 300px;
      text-wrap: balance;
      animation: rise .9s .16s var(--ease) both;
    }

    /* ============ FEATURE ROW ============ */
    .features {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: .8rem;
      letter-spacing: .02em;
      color: var(--faint);
      animation: rise .9s .22s var(--ease) both;
    }

    .features .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--faint);
      opacity: .7;
    }

    /* ============ CTA BUTTON ============ */
    .btn {
      margin-top: 44px;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 20px 38px;
      background: var(--ink);
      color: var(--bg);
      border-radius: 100px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.005em;
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      box-shadow: var(--shadow);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease);
      -webkit-tap-highlight-color: transparent;
      animation: rise .9s .28s var(--ease) both;
    }

    /* shine sweep */
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255,255,255,.18) 50%,
        transparent 100%
      );
      transform: translateX(-200%) skewX(-20deg);
      transition: transform .9s var(--ease);
      pointer-events: none;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 36px 76px -22px rgba(35,25,12,.42);
      outline: none;
    }

    .btn:hover::after,
    .btn:focus-visible::after {
      transform: translateX(280%) skewX(-20deg);
    }

    .btn:active { transform: translateY(-1px) scale(.985); }

    .btn .robot {
      display: grid;
      place-items: center;
      color: var(--android);
      flex-shrink: 0;
      transition: transform .35s var(--ease);
    }

    .btn:hover .robot { transform: scale(1.08); }

    /* ============ META BELOW BUTTON ============ */
    .meta {
      margin-top: 18px;
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--faint);
      animation: rise .9s .34s var(--ease) both;
    }

    /* ============ FOOTER ============ */
    footer {
      margin-top: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      line-height: 1.7;
      color: var(--faint);
      animation: rise .9s .42s var(--ease) both;
    }

    footer a {
      color: var(--faint);
      text-decoration: none;
      transition: color .25s ease;
    }

    footer a:hover { color: var(--accent); }

    .copy {
      margin-top: 14px;
      font-size: .7rem;
      letter-spacing: .04em;
      opacity: .75;
    }

    /* ============ ANIMATION ============ */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
      body { padding: 52px 20px; }
      .logo { width: 76px; height: 76px; margin-bottom: 28px; }
      .btn { padding: 18px 32px; font-size: .95rem; gap: 12px; }
      footer { margin-top: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
